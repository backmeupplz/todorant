# On a published GitHub release tagged ios-v*: build, sign (cloud signing with the App Store Connect API key) and upload
# the iPhone app, then send it to App Review, released automatically once approved. A submission of an older version
# still waiting or in review is cancelled for this one (ios/submit.py).
# Bump CURRENT_PROJECT_VERSION and MARKETING_VERSION (= the tag without ios-v) in Todorant.xcodeproj first.
# What's New comes from the first paragraph of the GitHub release.
# Secret: APP_STORE_CONNECT_KEY (contents of AuthKey_3FT23S9NSM.p8).
name: iOS release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'ios-v')
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: 3FT23S9NSM
      ASC_ISSUER_ID: a18f42ff-6c44-410c-badf-50b11de8dbb8
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: API key and version
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          version=$(grep -m1 -oE 'MARKETING_VERSION = [^;]+' ios/Todorant.xcodeproj/project.pbxproj | cut -d' ' -f3)
          test "$version" = "${TAG#ios-v}" || { echo "The tag says ${TAG#ios-v}, the project $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$(grep -m1 -oE 'CURRENT_PROJECT_VERSION = [^;]+' ios/Todorant.xcodeproj/project.pbxproj | cut -d' ' -f3)" >> "$GITHUB_ENV"
      - run: ios/release.sh
      - name: Submit for review
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          python3 -c 'import os; print(os.environ["BODY"].replace("\r", "").strip().split("\n\n")[0])' > notes.txt
          test -s notes.txt || echo "Bug fixes and improvements" > notes.txt
          python3 -m venv venv && venv/bin/pip install -q 'pyjwt[crypto]'
          venv/bin/python ios/submit.py "$VERSION" "$BUILD" notes.txt
