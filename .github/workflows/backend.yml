name: Backend
on:
  push:
    branches: [main]
    paths: [backend/**, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**, .github/workflows/backend.yml]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:4.4
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: backend
    env:
      MONGOMS_DISABLE_POSTINSTALL: 1
      TEST_MONGO: mongodb://localhost:27017
      JWT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
      # node_modules itself is cached: a hit skips the install entirely
      - id: modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-modules-${{ runner.os }}-${{ hashFiles('backend/yarn.lock', 'backend/.nvmrc') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --ignore-engines
      # Independent checks run in parallel; any failure fails the step
      - run: |
          yarn -s prettier --check src &
          yarn -s eslint --max-warnings 0 --ext ts src &
          yarn -s tsc --skipLibCheck --noEmit &
          yarn -s jest --forceExit src/__tests__/v2.ts &
          for job in $(jobs -p); do wait $job || exit 1; done

  # Easypanel builds the `deploy/backend` branch, so only backend changes deploy
  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh api -X PATCH repos/${{ github.repository }}/git/refs/heads/deploy/backend -f sha=${{ github.sha }} -F force=true
        env:
          GH_TOKEN: ${{ github.token }}
