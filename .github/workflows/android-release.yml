# On a published GitHub release tagged android-v*: build both flavors with the upload key, attach the APKs,
# send the bundle to Google Play production and bring the F-Droid merge request up to this release.
# todorant-<version>.apk is the play flavor (with Google sign-in). F-Droid checks its own build of the tag
# against todorant-fdroid-<version>.apk (reproducible build), then ships ours.
# Play: a newer release replaces the one on the production track, so a release still in review is withdrawn for this one.
# Release notes for Play are fastlane/metadata/android/en-US/changelogs/<versionCode>.txt, the file F-Droid shows.
# Secrets: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_PROPERTIES, PLAY_SERVICE_ACCOUNT_JSON (service account with
# release rights on Todorant in Play Console), GITLAB_TOKEN (api scope on the fdroiddata fork). Steps whose secret is
# missing are skipped.
name: Android release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Version
        run: |
          echo "VERSION=${TAG#android-v}" >> "$GITHUB_ENV"
          echo "CODE=$(grep -oP 'versionCode = \K[\d_]+' app/build.gradle.kts | tr -d _)" >> "$GITHUB_ENV"
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.ANDROID_UPLOAD_PROPERTIES }} # storePassword, keyAlias, keyPassword lines
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/todorant-upload.jks
          { echo "storeFile=$HOME/.android/todorant-upload.jks"; echo "$PROPERTIES"; } > ~/.android/todorant-upload.properties
      - run: ./gradlew :app:assemblePlayRelease :app:assembleFdroidRelease :app:bundlePlayRelease
      - name: Attach APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/play/release/app-play-release.apk "todorant-$VERSION.apk"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "todorant-fdroid-$VERSION.apk"
          gh release upload "$TAG" todorant-*.apk --clobber
      - name: Play release notes
        if: ${{ env.PLAY_JSON != '' }}
        run: |
          mkdir whatsnew
          cp ../fastlane/metadata/android/en-US/changelogs/$CODE.txt whatsnew/whatsnew-en-US
      - name: Upload to Play
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.todorant
          releaseFiles: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          releaseName: ${{ env.VERSION }}
          track: production
          whatsNewDirectory: android/whatsnew
      # Once merged, F-Droid's bot finds new android-v* tags itself (AutoUpdateMode in the metadata)
      - name: Bring the F-Droid merge request up to this release
        if: ${{ env.GITLAB_TOKEN != '' }}
        env:
          SHA: ${{ github.sha }}
        shell: python3 {0}
        run: |
          import json, os, re, sys, urllib.request
          api = "https://gitlab.com/api/v4/projects/"
          mr = json.load(urllib.request.urlopen(api + "fdroid%2Ffdroiddata/merge_requests/52830"))
          if mr["state"] != "opened":
              sys.exit(print(f"The merge request is {mr['state']}: F-Droid updates from tags"))
          file = api + "87475150/repository/files/metadata%2Fcom.todorant.yml"
          old = urllib.request.urlopen(file + "/raw?ref=com.todorant").read().decode()
          new = old
          for key, value in [("versionName", os.environ["VERSION"]), ("versionCode", os.environ["CODE"]), ("commit", os.environ["SHA"]),
                             ("CurrentVersion", os.environ["VERSION"]), ("CurrentVersionCode", os.environ["CODE"])]:
              new = re.sub(rf"(?m)^([ -]*){key}: .*$", rf"\g<1>{key}: {value}", new)
          if new == old:
              sys.exit(print("The merge request is at this release already"))
          body = json.dumps({"branch": "com.todorant", "content": new, "commit_message": f"Todorant {os.environ['VERSION']}"}).encode()
          urllib.request.urlopen(urllib.request.Request(file, body, method="PUT", headers={"PRIVATE-TOKEN": os.environ["GITLAB_TOKEN"], "Content-Type": "application/json"}))
          print(new)
