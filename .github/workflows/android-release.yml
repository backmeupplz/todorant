# On a published GitHub release tagged android-v*: build both flavors with the upload key and attach them.
# todorant-<version>.apk is the play flavor (with Google sign-in). F-Droid checks its own build of the tag
# against todorant-fdroid-<version>.apk (reproducible build), then ships ours. Play uploads stay manual.
name: Android release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  apk:
    if: startsWith(github.event.release.tag_name, 'android-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.ANDROID_UPLOAD_PROPERTIES }} # storePassword, keyAlias, keyPassword lines
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/todorant-upload.jks
          { echo "storeFile=$HOME/.android/todorant-upload.jks"; echo "$PROPERTIES"; } > ~/.android/todorant-upload.properties
      - run: ./gradlew :app:assemblePlayRelease :app:assembleFdroidRelease
      - name: Attach APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/play/release/app-play-release.apk "todorant-${TAG#android-v}.apk"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "todorant-fdroid-${TAG#android-v}.apk"
          gh release upload "$TAG" todorant-*.apk --clobber
