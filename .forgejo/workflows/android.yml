name: Android
on:
  push:
    branches: [main]
    paths: [android/**, .forgejo/workflows/android.yml]
  pull_request:
    paths: [android/**, .forgejo/workflows/android.yml]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub-hosted runners ship the Android SDK; the Forgejo job image does not
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # Caches the Gradle distribution, dependencies, build cache and configuration cache
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew :app:testPlayDebugUnitTest :app:assembleDebug
