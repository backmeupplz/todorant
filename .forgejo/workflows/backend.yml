name: Backend
on:
  push:
    branches: [main]
    paths: [backend/**, .forgejo/workflows/backend.yml]
  pull_request:
    paths: [backend/**, .forgejo/workflows/backend.yml]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Our own PRs and pushes run on the Mac runners; outsiders' PRs (AGit via the github bot) on Linux
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude","radiant"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      MONGOMS_DISABLE_POSTINSTALL: 1
      JWT: test
      # Production's MongoDB version
      MONGO_VERSION: 8.0.34
    steps:
      # The Mac runners give every job a new, empty workspace. Instead each runner instance keeps one
      # sparse (backend/ only: the whole tree is ~450 MB of blobs, store screenshots), blobless clone in its
      # own tool cache (it runs one job at a time) and the job workspace links to it: fetches are
      # incremental and node_modules stays installed.
      - name: Check out (persistent Mac workspace)
        if: runner.os == 'macOS'
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ws="$RUNNER_TOOL_CACHE/todorant-backend-workspace"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          if [ ! -d "$ws/.git" ]; then
            rm -rf "$ws" && git init -q "$ws"
            git -C "$ws" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            git -C "$ws" config remote.origin.promisor true
            git -C "$ws" config remote.origin.partialclonefilter blob:none
            git -C "$ws" sparse-checkout set backend
          fi
          cd "$ws"
          rm -f .git/index.lock
          git fetch -q --no-tags --depth=1 --filter=blob:none origin "+$SHA:refs/ci/head"
          git checkout -q --force --detach "$SHA"
          git clean -ffdq
          git log -1 --format='%H %s'
          rm -rf "$GITHUB_WORKSPACE" && ln -s "$ws" "$GITHUB_WORKSPACE"
      # Other runners (outsiders' PRs) start from a fresh workspace, with backend/ only
      - if: runner.os != 'macOS'
        uses: actions/checkout@v4
        with:
          sparse-checkout: backend
      # The Mac runners keep their tool cache, so only a runner's first run downloads Node
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
      # On Linux node_modules itself is cached (a hit skips the install)
      - id: modules
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-modules-${{ runner.os }}-${{ hashFiles('backend/yarn.lock', 'backend/.nvmrc') }}
      - if: runner.os == 'Linux' && steps.modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --ignore-engines
      # On the Mac node_modules stays in the persistent workspace and is reinstalled for a new lockfile only
      # (yarn's linking took ~5 s a run). Each runner's yarn cache is its own (yarn 1's shared global cache
      # corrupts when two runners install at once).
      - if: runner.os == 'macOS'
        run: |
          hash="${{ hashFiles('backend/yarn.lock', 'backend/.nvmrc') }}"
          if [ "$(cat node_modules/.ci-hash 2>/dev/null)" != "$hash" ]; then
            yarn install --frozen-lockfile --ignore-engines --cache-folder "$RUNNER_TOOL_CACHE/yarn"
            echo "$hash" > node_modules/.ci-hash
          fi
      # A native mongod (the Mac runners have no Docker for a service container), installed once
      # per runner tool cache and checked against MongoDB's published SHA-256
      - name: MongoDB
        run: |
          dir="$RUNNER_TOOL_CACHE/mongodb/$MONGO_VERSION"
          if [ ! -x "$dir/bin/mongod" ]; then
            case "$(uname -s)-$(uname -m)" in
              Darwin-arm64) url=https://fastdl.mongodb.org/osx/mongodb-macos-arm64-$MONGO_VERSION.tgz
                sha=3255cbf2e70cc5de04220046e006067d20068656d1bfa674828768a51d20d5a6 ;;
              Linux-x86_64) url=https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-$MONGO_VERSION.tgz
                sha=3e55cdcf7013fbc805d29d8195230df4b23c7688733ee15ad58ac6bc2a416611 ;;
              *) echo "::error::No MongoDB build for $(uname -s) $(uname -m)"; exit 1 ;;
            esac
            curl -fsSL -o "$RUNNER_TEMP/mongodb.tgz" "$url"
            got="$( (sha256sum "$RUNNER_TEMP/mongodb.tgz" 2>/dev/null || shasum -a 256 "$RUNNER_TEMP/mongodb.tgz") | cut -d' ' -f1)"
            [ "$got" = "$sha" ] || { echo "::error::MongoDB $MONGO_VERSION doesn't match its SHA-256"; exit 1; }
            rm -rf "$dir" "$dir.tmp" && mkdir -p "$dir.tmp"
            tar -xzf "$RUNNER_TEMP/mongodb.tgz" -C "$dir.tmp" --strip-components 1 && mv "$dir.tmp" "$dir"
          fi
          echo "MONGOD=$dir/bin/mongod" >> "$GITHUB_ENV"
      # Independent checks run in parallel; any failure fails the step
      - run: |
          # A cancelled run can't clean up after itself on the Mac: stop this runner's old mongod
          pkill -f "^$MONGOD " || true
          port=$(node -e 's=require("net").createServer().listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close()})')
          # macOS starts a job at 256 open files: the test databases' collections, indexes and connections
          # outgrow that and mongod aborts mid-run (WiredTiger errno 24)
          ulimit -n 8192 || ulimit -n "$(ulimit -Hn)"
          "$MONGOD" --dbpath "$(mktemp -d "$RUNNER_TEMP/mongo.XXXXXX")" --bind_ip 127.0.0.1 --port $port --quiet > "$RUNNER_TEMP/mongod.log" 2>&1 &
          mongod=$!
          trap 'kill $mongod' EXIT
          yarn -s prettier --check src & prettier=$!
          yarn -s eslint --max-warnings 0 --ext ts src & eslint=$!
          yarn -s tsc --skipLibCheck --noEmit & tsc=$!
          until (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; do
            kill -0 $mongod 2>/dev/null || { cat "$RUNNER_TEMP/mongod.log"; exit 1; }
            sleep 0.1
          done
          TEST_MONGO=mongodb://127.0.0.1:$port yarn -s jest --forceExit & jest=$!
          for job in $prettier $eslint $tsc $jest; do wait $job || exit 1; done
