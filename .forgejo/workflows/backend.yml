name: Backend
on:
  push:
    branches: [main]
    paths: [backend/**, .forgejo/workflows/backend.yml]
  pull_request:
    paths: [backend/**, .forgejo/workflows/backend.yml]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Our own PRs and pushes run on the Mac runners; outsiders' PRs (AGit via the github bot) on Linux
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      MONGOMS_DISABLE_POSTINSTALL: 1
      JWT: test
      # Production's MongoDB version
      MONGO_VERSION: 8.0.34
    steps:
      - uses: actions/checkout@v4
      # The Mac runners keep their tool cache, so only a runner's first run downloads Node
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
      # On Linux node_modules itself is cached (a hit skips the install); on the Mac each runner keeps
      # its own yarn cache (yarn 1's shared global cache corrupts when two runners install at once)
      - id: modules
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-modules-${{ runner.os }}-${{ hashFiles('backend/yarn.lock', 'backend/.nvmrc') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --ignore-engines ${{ runner.os == 'macOS' && '--cache-folder "$RUNNER_TOOL_CACHE/yarn"' || '' }}
      # A native mongod (the Mac runners have no Docker for a service container), installed once
      # per runner tool cache and checked against MongoDB's published SHA-256
      - name: MongoDB
        run: |
          dir="$RUNNER_TOOL_CACHE/mongodb/$MONGO_VERSION"
          if [ ! -x "$dir/bin/mongod" ]; then
            case "$(uname -s)-$(uname -m)" in
              Darwin-arm64) url=https://fastdl.mongodb.org/osx/mongodb-macos-arm64-$MONGO_VERSION.tgz
                sha=3255cbf2e70cc5de04220046e006067d20068656d1bfa674828768a51d20d5a6 ;;
              Linux-x86_64) url=https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-$MONGO_VERSION.tgz
                sha=3e55cdcf7013fbc805d29d8195230df4b23c7688733ee15ad58ac6bc2a416611 ;;
              *) echo "::error::No MongoDB build for $(uname -s) $(uname -m)"; exit 1 ;;
            esac
            curl -fsSL -o "$RUNNER_TEMP/mongodb.tgz" "$url"
            got="$( (sha256sum "$RUNNER_TEMP/mongodb.tgz" 2>/dev/null || shasum -a 256 "$RUNNER_TEMP/mongodb.tgz") | cut -d' ' -f1)"
            [ "$got" = "$sha" ] || { echo "::error::MongoDB $MONGO_VERSION doesn't match its SHA-256"; exit 1; }
            rm -rf "$dir" "$dir.tmp" && mkdir -p "$dir.tmp"
            tar -xzf "$RUNNER_TEMP/mongodb.tgz" -C "$dir.tmp" --strip-components 1 && mv "$dir.tmp" "$dir"
          fi
          echo "MONGOD=$dir/bin/mongod" >> "$GITHUB_ENV"
      # Independent checks run in parallel; any failure fails the step
      - run: |
          # A cancelled run can't clean up after itself on the Mac: stop this runner's old mongod
          pkill -f "^$MONGOD " || true
          port=$(node -e 's=require("net").createServer().listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close()})')
          "$MONGOD" --dbpath "$(mktemp -d "$RUNNER_TEMP/mongo.XXXXXX")" --bind_ip 127.0.0.1 --port $port --quiet > "$RUNNER_TEMP/mongod.log" 2>&1 &
          mongod=$!
          trap 'kill $mongod' EXIT
          yarn -s prettier --check src & prettier=$!
          yarn -s eslint --max-warnings 0 --ext ts src & eslint=$!
          yarn -s tsc --skipLibCheck --noEmit & tsc=$!
          until (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; do
            kill -0 $mongod 2>/dev/null || { cat "$RUNNER_TEMP/mongod.log"; exit 1; }
            sleep 0.1
          done
          TEST_MONGO=mongodb://127.0.0.1:$port yarn -s jest --forceExit src/__tests__/v2.ts src/__tests__/appleAuthKey.ts & jest=$!
          for job in $prettier $eslint $tsc $jest; do wait $job || exit 1; done
